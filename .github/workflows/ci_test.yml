name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  msrv:
    name: Rust 1.88 minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Locked all-targets check
        run: cargo check --locked --workspace --all-targets

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests
        run: cargo test --locked --workspace

  coverage:
    name: coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate LCOV report
        run: cargo llvm-cov --locked --workspace --all-targets --lcov --output-path lcov.info
      - name: Upload LCOV artifact
        uses: actions/upload-artifact@v4
        with:
          name: vissue-lcov
          path: lcov.info

  cli-smoke:
    name: CLI smoke over the fixture tracker
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the release binary
        run: cargo build --locked --release --bin vissue
      - name: Query and validate the fixture tracker
        run: |
          set -euo pipefail
          BIN=./target/release/vissue
          "$BIN" --version
          test "$("$BIN" --root tests/fixture_vault count)" = "6"
          test "$("$BIN" --root tests/fixture_vault count --ready)" = "3"
          "$BIN" --root tests/fixture_vault check
          "$BIN" --root tests/fixture_vault export | while read -r line; do
            printf '%s' "$line" | python3 -c 'import json,sys; json.load(sys.stdin)'
          done
      - name: Mirror is regenerable and unchanged on a second run
        run: |
          set -euo pipefail
          BIN=./target/release/vissue
          "$BIN" --root tests/fixture_vault mirror --out /tmp/mirror-a.org
          "$BIN" --root tests/fixture_vault mirror --out /tmp/mirror-b.org
          diff /tmp/mirror-a.org /tmp/mirror-b.org
          grep -q "MIRROR: generated by" /tmp/mirror-a.org
      - name: The fixture tracker is untouched by read-only verbs
        run: git diff --exit-code -- tests/fixture_vault
