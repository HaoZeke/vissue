name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25

  quality:
    name: format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  msrv:
    name: Rust 1.88 minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Locked all-targets check
        run: cargo check --locked --workspace --all-targets

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Workspace tests
        run: cargo test --locked --workspace

  coverage:
    name: coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: taiki-e/install-action@60c08ce81d769135aafd96f96efc85993d9cb8e4
      - name: Generate LCOV report
        run: cargo llvm-cov --locked --workspace --all-targets --fail-under-lines 89 --lcov --output-path lcov.info
      - name: Upload LCOV artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vissue-lcov
          path: lcov.info
          if-no-files-found: error

  cli-smoke:
    name: CLI smoke over the fixture tracker
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build the release binary
        run: cargo build --locked --release --bin vissue
      - name: Query and validate the fixture tracker
        run: |
          set -euo pipefail
          BIN=./target/release/vissue
          "$BIN" --version
          test "$("$BIN" --root tests/fixture_vault count)" = "6"
          test "$("$BIN" --root tests/fixture_vault count --ready)" = "3"
          "$BIN" --root tests/fixture_vault check
          "$BIN" --root tests/fixture_vault export | while read -r line; do
            printf '%s' "$line" | python3 -c 'import json,sys; json.load(sys.stdin)'
          done
      - name: Mirror is regenerable and unchanged on a second run
        run: |
          set -euo pipefail
          BIN=./target/release/vissue
          "$BIN" --root tests/fixture_vault mirror --out /tmp/mirror-a.org
          "$BIN" --root tests/fixture_vault mirror --out /tmp/mirror-b.org
          diff /tmp/mirror-a.org /tmp/mirror-b.org
          grep -q "MIRROR: generated by" /tmp/mirror-a.org
      - name: The fixture tracker is untouched by read-only verbs
        run: git diff --exit-code -- tests/fixture_vault
