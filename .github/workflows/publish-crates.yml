name: crates.io

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to publish (defaults to the triggering ref)'
        required: false
        type: string
      dry_run:
        description: 'Mint the token and package, but upload nothing'
        required: false
        default: true
        type: boolean

concurrency:
  group: crates-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  package:
    name: Verify crate packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: HUD system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev

      # Builds each packaged tarball exactly as `cargo publish` would, so a
      # crate that cannot be consumed from the registry fails here rather
      # than after an irreversible upload. Every crate is packaged against
      # its siblings' local paths, because the versions they depend on are
      # not on the registry until this run puts them there.
      - name: Package
        run: |
          set -euo pipefail
          mapfile -t crates < <(scripts/publish-order.py)
          echo "publishing order: ${crates[*]}"
          for target in "${crates[@]}"; do
            args=()
            for dep in "${crates[@]}"; do
              [ "$dep" = "$target" ] && continue
              args+=(--config "patch.crates-io.$dep.path=\"$GITHUB_WORKSPACE/crates/$dep\"")
            done
            echo "::group::package $target"
            cargo "${args[@]}" publish --dry-run --locked -p "$target"
            echo "::endgroup::"
          done

  publish:
    name: Publish to crates.io
    needs: [package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment:
      name: crates-io
      url: https://crates.io/crates/vissue-cli
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      # The tag names the version, so a tag that disagrees with the manifest
      # would publish something nobody asked for.
      - name: Validate the tag against the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version=$(sed -n '0,/^version = /s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          test -n "$version"
          test "v$version" = "${GITHUB_REF_NAME}"

      # Trusted publishing: exchange this job's OIDC identity for a token
      # that lives only for the length of the run. crates.io accepts it
      # because the registry side pins this repository, this workflow file
      # and the environment above; a mismatch fails here rather than
      # reaching for a long-lived credential.
      - name: Mint a trusted-publishing token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.5

      # Dependency order, computed from the manifests rather than written
      # out here: a crate names its siblings by version, so the registry has
      # to hold each one before the next resolves. The wait between uploads
      # is that propagation and nothing else.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          version=$(sed -n '0,/^version = /s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          test -n "$version"
          mapfile -t crates < <(scripts/publish-order.py)
          echo "publishing order: ${crates[*]}"
          for crate in "${crates[@]}"; do
            echo "::group::publish $crate"
            cargo publish --locked -p "$crate" $DRY_RUN
            echo "::endgroup::"
            if [ -n "$DRY_RUN" ]; then
              continue
            fi
            for _ in $(seq 1 30); do
              if cargo info "$crate@$version" >/dev/null 2>&1; then
                break
              fi
              sleep 10
            done
          done
