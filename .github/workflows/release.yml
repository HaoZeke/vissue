# Release wiring stub. `dist generate` (cargo-dist) replaces this file with the
# generated matrix once the first tag is cut; the configuration it reads lives
# in dist-workspace.toml.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --release --bin vissue --bin vissue-mcp
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vissue-x86_64-unknown-linux-gnu
          path: |
            target/release/vissue
            target/release/vissue-mcp
