# Release wiring stub. `dist generate` (cargo-dist) replaces this file with the
# generated matrix once the first tag is cut; the configuration it reads lives
# in dist-workspace.toml.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build
        run: cargo build --locked --release --bin vissue --bin vissue-mcp
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vissue-x86_64-unknown-linux-gnu
          path: |
            target/release/vissue
            target/release/vissue-mcp
          if-no-files-found: error
