[package]
name = "vissue-mcp"
description = "Model Context Protocol server exposing vissue issue tracking to agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
lints.workspace = true

[[bin]]
name = "vissue-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
rmcp = { version = "1.2", features = ["server", "transport-io", "transport-async-rw", "macros"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
vissue-core.workspace = true

[dev-dependencies]
tempfile.workspace = true
